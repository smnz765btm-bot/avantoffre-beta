[build]
  command = "node build-revisite.js"
  publish = "dist"
  functions = "netlify/functions"

# Redeploy intentionally after runtime environment updates.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
