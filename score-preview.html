<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ReVisite — Vérification du scoring</title><body style="font-family:Arial;background:#f4f7f9;max-width:1200px;margin:30px auto;padding:20px"><h1>Vérification du scoring ReVisite</h1><p>Ouvrez un rapport JSON sauvegardé pour recalculer ses notes localement. Aucun appel IA, aucun document envoyé.</p><input type="file" accept="application/json" aria-label="Rapport sauvegardé"><p><label>Lien de l’annonce <input id="listing" type="url" style="width:55%" placeholder="https://www.bienici.com/annonce/…"></label> <button id="refresh">Actualiser le prix</button></p><p id="status" aria-live="polite"></p><div id="output"></div><script src="/score-details.js"></script><script type="module">
import{hardenScores}from'/scoring-core.mjs';import{applyListing}from'/listing-core.mjs';let result;
const render=()=>{hardenScores(result);document.querySelector('#output').innerHTML=window.rvScoreDetailsHTML(result.scores)};
document.querySelector('input[type=file]').onchange=async e=>{try{const d=JSON.parse(await e.target.files[0].text());result=d.result||d;result.scores.revision=0;render()}catch{document.querySelector('#output').textContent='Rapport JSON invalide.'}};
document.querySelector('#refresh').onclick=async()=>{const status=document.querySelector('#status');if(!result){status.textContent='Ouvrez d’abord le rapport sauvegardé.';return}try{status.textContent='Lecture de l’annonce…';const r=await fetch('/api/listing?url='+encodeURIComponent(document.querySelector('#listing').value));const listing=await r.json();if(listing.status!=='ok'){status.textContent='Prix non récupéré : vérifiez le lien ou complétez les informations de l’analyse.';return}applyListing(result.analysis,listing);result.scores.revision=0;render();status.textContent='Prix actualisé depuis Bien’ici. Aucun appel IA.'}catch{status.textContent='Annonce inaccessible pour le moment.'}};
</script></body></html>
