<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ReVisite — Vérification du scoring</title><body style="font-family:Arial;background:#f4f7f9;max-width:1200px;margin:30px auto;padding:20px"><h1>Vérification du scoring ReVisite</h1><p>Ouvrir un rapport JSON sauvegardé pour recalculer ses notes localement. Aucun appel IA, aucun document envoyé.</p><input type="file" accept="application/json" aria-label="Rapport sauvegardé"><div id="output"></div><script src="/score-details.js"></script><script type="module">import{explainScores}from'/scoring-core.mjs';document.querySelector('input').onchange=async e=>{try{const d=JSON.parse(await e.target.files[0].text());const result=d.result||d;document.querySelector('#output').innerHTML=window.rvScoreDetailsHTML(explainScores(result))}catch{document.querySelector('#output').textContent='Rapport JSON invalide.'}};</script></body></html>
