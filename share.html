<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Analyse partagée — AvantOffre</title><style>:root{--navy:#062b4a;--teal:#10aa8d;--bg:#f5f8fa;--ink:#10283c;--muted:#687b89;--line:#dce6eb;--green:#176b54;--greenbg:#eaf7f2;--amber:#8a5a0a;--amberbg:#fff5df}*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,system-ui,sans-serif;background:var(--bg);color:var(--ink)}.wrap{max-width:1080px;margin:auto;padding:0 22px}nav{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center}.brand{font-size:25px;font-weight:950;color:var(--navy)}.brand em{font-style:normal;color:var(--teal)}main{padding:30px 0}.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:22px;margin:14px 0}.hero{background:linear-gradient(135deg,#edfaf7,#fff);border-color:#ccebe3}.eyebrow{font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:1.2px;color:var(--teal)}h1,h2,h3{color:var(--navy)}h1{margin:6px 0 8px}.summary{line-height:1.6;color:#365064}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.kpi{border:1px solid var(--line);border-radius:12px;padding:12px}.kpi span{display:block;font-size:10px;color:var(--muted);text-transform:uppercase;font-weight:800}.kpi b{display:block;margin-top:5px;color:var(--navy)}.cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}.box{background:#f3f8fa;border-radius:13px;padding:14px}ul{padding-left:19px}li{margin:7px 0;line-height:1.45}.tag{display:inline-block;padding:7px 10px;border-radius:99px;background:var(--amberbg);color:var(--amber);font-size:11px;font-weight:800}.source{font-size:11px;color:var(--muted)}.error{text-align:center;padding:70px 20px}.footer{text-align:center;padding:24px;color:var(--muted);font-size:11px}@media(max-width:760px){.grid,.cols{grid-template-columns:1fr 1fr}}@media(max-width:480px){.grid,.cols{grid-template-columns:1fr}}@media print{nav,.footer{display:none}}</style></head><body><nav><div class="wrap" style="width:100%"><div class="brand">Avant<em>Offre</em></div></div></nav><main><div class="wrap" id="app"><div class="card">Chargement de l’analyse…</div></div></main><div class="footer">AvantOffre — Analyse documentaire et aide à la décision avant offre.</div><script>const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const arr=v=>Array.isArray(v)?v:[];const txt=x=>typeof x==='string'?x:(x?.label||x?.title||x?.description||x?.detail||x?.issue||x?.work||'');const money=v=>v==null?'—':new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR',maximumFractionDigits:0}).format(v);const list=(v,n=8)=>arr(v).slice(0,n).length?`<ul>${arr(v).slice(0,n).map(x=>`<li>${esc(txt(x))}</li>`).join('')}</ul>`:'<span class="source">Aucun élément significatif identifié.</span>';const k=(l,v)=>`<div class="kpi"><span>${l}</span><b>${v}</b></div>`;function render(d){const a=d.result?.analysis||{},s=d.result?.scores||{},p=a.property||{},m=a.market||{},c=a.copro_metrics||{},co=a.copro||{},w=a.works||{},bb=a.buyer_blocks||{},dw=bb.diagnostic_works||{},fc=bb.future_copro_costs||{},rb=bb.real_acquisition_budget||{},bc=bb.before_offer_checks||{},ex=a.executive_summary||{},n=a.negotiation||{},v=a.verdict||{};document.title=(p.address?`${p.address} — `:'')+'Analyse AvantOffre';document.querySelector('#app').innerHTML=`<div class="eyebrow">Analyse AvantOffre partagée</div><div class="card hero"><h1>${esc(v.label||'Décision avant offre')}</h1><p class="summary">${esc(v.summary||ex.overview||'')}</p><span class="tag">Vigilance ${esc(v.vigilance||'modérée')}</span><div class="grid" style="margin-top:16px">${k('Score global',s.overall==null?'N/C':s.overall+'/100')}${k('Bien',s.property==null?'N/C':s.property+'/100')}${k('Copropriété',s.copro==null?'N/C':s.copro+'/100')}${k('Prix & offre',s.market==null?'N/C':s.market+'/100')}</div></div><div class="card"><h2>Ce qu’il faut retenir</h2><p class="summary">${esc(ex.overview||v.why||'')}</p><div class="cols"><div class="box"><h3>Points positifs</h3>${list(ex.top_strengths||p.assets,3)}</div><div class="box"><h3>Points de vigilance</h3>${list(ex.top_risks||p.weaknesses,3)}</div></div></div><div class="card"><h2>Prix & offre</h2><div class="grid">${k('Prix affiché',money(p.asking_price))}${k('Valeur estimée',m.estimate_low&&m.estimate_high?money(m.estimate_low)+' – '+money(m.estimate_high):'—')}${k('Offre conseillée',m.offer_low&&m.offer_high?money(m.offer_low)+' – '+money(m.offer_high):'—')}${k('Prix / m²',p.price_per_m2?money(p.price_per_m2):'—')}</div><p class="summary">${esc(m.analysis||m.positioning||'')}</p><h3>Stratégie</h3><p class="summary">${esc(n.recommended_strategy||'')}</p>${list(n.arguments,5)}</div><div class="card"><h2>Le bien</h2><div class="grid">${k('Surface',p.surface_m2?p.surface_m2+' m²':'—')}${k('Pièces',p.rooms??'—')}${k('Étage',esc(p.floor||'—'))}${k('DPE',esc(p.dpe||'—'))}</div><p class="summary">${esc(p.property_analysis||'')}</p></div><div class="card"><h2>Copropriété</h2><div class="grid">${k('Charges / an',money(c.lot_annual_charges))}${k('Impayés collectifs',money(c.collective_arrears))}${k('Fonds travaux',money(c.works_fund))}${k('Budget',money(c.annual_budget))}</div><p class="summary">${esc(co.financial_analysis||'')}</p><h3>Travaux copropriété</h3>${list([...arr(w.voted),...arr(w.recommended_pppt),...arr(w.discussed)],8)}</div><div class="card"><h2>Travaux & diagnostics</h2><p class="summary">${esc(dw.summary||'')}</p>${arr(dw.items).length?`<ul>${arr(dw.items).map(x=>`<li><b>${esc(x.category||'Poste')}</b> — ${esc(x.issue||'')} · ${esc(x.nature||'à confirmer')} · ${x.budget_low!=null||x.budget_high!=null?money(x.budget_low)+' – '+money(x.budget_high):'budget à confirmer'}${x.source?`<div class="source">${esc(x.source)}</div>`:''}</li>`).join('')}</ul>`:list(p.diagnostics,8)}<div class="grid">${k('Budget travaux bas',money(dw.total_budget_low))}${k('Budget travaux haut',money(dw.total_budget_high))}</div><p class="source">${esc(dw.budget_note||'Les estimations éventuelles restent à confirmer par devis professionnels.')}</p></div><div class="card"><h2>Dépenses futures de copropriété</h2><p class="summary">${esc(fc.summary||'')}</p>${arr(fc.items).length?`<ul>${arr(fc.items).map(x=>`<li><b>${esc(x.status||'À confirmer')}</b> — ${esc(x.work||'')} ${x.estimated_lot_share!=null?'· quote-part estimée '+money(x.estimated_lot_share):''}</li>`).join('')}</ul>`:'<p class="source">Aucune dépense future chiffrable identifiée.</p>'}${list(fc.unknown_exposure,5)}</div><div class="card"><h2>Budget réel d’acquisition</h2><div class="grid">${k('Prix',money(rb.purchase_price??p.asking_price))}${k('Frais acquisition',money(rb.acquisition_fees_estimate))}${k('Travaux privatifs',rb.private_works_low!=null||rb.private_works_high!=null?money(rb.private_works_low)+' – '+money(rb.private_works_high):'—')}${k('Budget connu',rb.known_total_low!=null||rb.known_total_high!=null?money(rb.known_total_low)+' – '+money(rb.known_total_high):'—')}</div><p class="summary">${esc(rb.summary||'')}</p>${list(rb.unknown_costs,5)}</div><div class="card"><h2>À vérifier avant l’offre</h2><p class="summary">${esc(bc.summary||'')}</p>${list(bc.checks?.length?bc.checks:a.questions_before_offer,8)}${arr(bc.inconsistencies).length?`<h3>Incohérences détectées</h3>${list(bc.inconsistencies,6)}`:''}${arr(bc.negotiation_impacts).length?`<h3>Impact sur la négociation</h3>${list(bc.negotiation_impacts,6)}`:''}</div><div class="card"><h2>Conclusion</h2><p class="summary">${esc(v.why||v.summary||'')}</p><div class="cols"><div class="box"><h3>Feu vert si…</h3>${list(v.go_if,5)}</div><div class="box"><h3>À reconsidérer si…</h3>${list(v.stop_if,5)}</div></div></div>`}async function init(){const id=new URLSearchParams(location.search).get('id');if(!id){document.querySelector('#app').innerHTML='<div class="card error"><h2>Lien de partage invalide</h2></div>';return}try{const r=await fetch('/api/shared-analysis?id='+encodeURIComponent(id));const d=await r.json();if(!r.ok)throw Error(d.error||'Analyse introuvable');render(d)}catch(e){document.querySelector('#app').innerHTML=`<div class="card error"><h2>Analyse indisponible</h2><p>${esc(e.message)}</p></div>`}}init();</script></body></html>
