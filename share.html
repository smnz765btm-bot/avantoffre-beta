<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Analyse partagée — ReVisite</title>
<style>
:root{--blue:#075cff;--ink:#14202b;--muted:#65717d;--bg:#f5f7fa;--line:#e1e7ed;--ok:#13795b;--okbg:#eaf7f2;--warn:#9a6500;--warnbg:#fff5df;--soft:#eef3ff}
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,system-ui,sans-serif;background:var(--bg);color:var(--ink)}.wrap{max-width:1080px;margin:auto;padding:0 22px}
nav{height:70px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center}.brand{font-size:25px;font-weight:950;letter-spacing:-1px;color:#111}.brand b{color:var(--blue)}.baseline{font-size:10px;color:var(--muted);margin-left:10px}
main{padding:28px 0}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;margin:12px 0}.hero{border-top:4px solid var(--blue)}.eyebrow{font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:1.1px;color:var(--blue)}h1,h2,h3{margin-top:0}h1{font-size:29px;margin:6px 0 8px}h2{font-size:18px;margin-bottom:12px}h3{font-size:13px;margin:14px 0 7px}.summary{line-height:1.55;color:#3d4c59;font-size:13px}.muted{color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.kpi{border:1px solid var(--line);border-radius:12px;padding:11px;background:#fbfcfd}.kpi span{display:block;font-size:9px;color:var(--muted);text-transform:uppercase;font-weight:800}.kpi b{display:block;margin-top:5px;font-size:16px}.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}.box{background:#f7f9fb;border-radius:12px;padding:13px}
.tag{display:inline-block;padding:6px 9px;border-radius:99px;background:var(--soft);color:#184baf;font-size:10px;font-weight:800}.scope{padding:11px 13px;border-radius:12px;background:#f7f9fb;border:1px solid var(--line);font-size:11px;line-height:1.45}.scope.warn{background:var(--warnbg);border-color:#efdaa7}
ul{padding-left:18px;margin:8px 0}li{margin:6px 0;line-height:1.45;font-size:12px}.source{font-size:10px;color:var(--muted);margin-top:2px}.empty{font-size:11px;color:var(--muted)}
.statusRow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.statusPill{padding:7px 9px;border-radius:99px;background:#f0f3f5;color:#51616d;font-size:10px;font-weight:800}.statusPill.ok{background:var(--okbg);color:var(--ok)}.statusPill.warn{background:var(--warnbg);color:var(--warn)}
.notice{padding:12px;border-radius:12px;background:var(--warnbg);color:#6f510f;font-size:11px;line-height:1.45}.tableWrap{overflow:auto;margin-top:10px}.compTable{width:100%;border-collapse:collapse;font-size:11px;min-width:680px}.compTable th,.compTable td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}.compTable th{font-size:9px;text-transform:uppercase;color:var(--muted)}.sectionNote{font-size:10px;color:var(--muted);line-height:1.45;margin-top:8px}.error{text-align:center;padding:70px 20px}.footer{text-align:center;padding:24px;color:var(--muted);font-size:10px}
@media(max-width:760px){.grid,.cols{grid-template-columns:1fr 1fr}}@media(max-width:480px){.grid,.cols{grid-template-columns:1fr}}@media print{nav,.footer{display:none}body{background:#fff}.card{break-inside:avoid}}
</style>
</head>
<body>
<nav><div class="wrap" style="width:100%;display:flex;align-items:center"><div class="brand"><b>[re]</b>visite</div><div class="baseline">Au-delà de la visite.</div></div></nav>
<main><div class="wrap" id="app"><div class="card">Chargement de l’analyse…</div></div></main>
<div class="footer">ReVisite — Analyse documentaire et aide à la décision avant offre.</div>
<link rel="stylesheet" href="/report-summary.css"><script src="/score-details.js"></script><script src="/report-summary.js"></script><script>
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const arr=v=>Array.isArray(v)?v:[];
const txt=x=>{if(typeof x==='string')return x;if(!x||typeof x!=='object')return'';if(x.claim||x.label||x.title||x.description||x.detail||x.issue||x.work||x.item)return x.claim||x.label||x.title||x.description||x.detail||x.issue||x.work||x.item;if(x.name)return x.name+(x.reason?' — '+x.reason:'');return''};
const money=v=>v==null||v===''?'N/C':new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR',maximumFractionDigits:0}).format(v);
const list=(v,n=8,empty='Aucun élément significatif identifié.')=>arr(v).slice(0,n).length?`<ul>${arr(v).slice(0,n).map(x=>`<li>${esc(txt(x))}${x?.source?`<div class="source">${esc(x.source)}${x.page?' · p. '+esc(x.page):''}</div>`:''}</li>`).join('')}</ul>`:`<span class="empty">${esc(empty)}</span>`;
const k=(l,v)=>`<div class="kpi"><span>${esc(l)}</span><b>${v}</b></div>`;
const score=v=>v===null||v===undefined||v===''||!Number.isFinite(Number(v))?null:Math.max(0,Math.min(100,Math.round(Number(v))));
const val=v=>v===null||v===undefined||v===''?'N/C':esc(v);
const comparableTable=v=>{const rows=arr(v).filter(x=>x&&x.price).slice(0,6);if(!rows.length)return'<span class="empty">Aucune vente comparable suffisamment fiable.</span>';return '<div class="tableWrap"><table class="compTable"><thead><tr><th>Comparable</th><th>Date</th><th>Distance</th><th>Prix</th><th>Surface</th><th>€/m²</th></tr></thead><tbody>'+rows.map(x=>'<tr><td>'+esc(x.label||x.address||'Comparable')+'</td><td>'+esc(x.date||'—')+'</td><td>'+esc(x.distance_note||((x.distance_m!=null?x.distance_m+' m':'—')))+'</td><td>'+money(x.price)+'</td><td>'+(x.surface!=null?esc(x.surface)+' m²':'—')+'</td><td>'+(x.price_m2!=null?money(x.price_m2):'—')+'</td></tr>').join('')+'</tbody></table></div>'};
function render(d){const r=d.result||{};document.title=(r.analysis?.property?.address||'Votre dossier')+' — ReVisite';document.querySelector('#app').innerHTML=window.rvReportHTML(r);}
async function init(){
  const id=new URLSearchParams(location.search).get('id');
  if(!id){document.querySelector('#app').innerHTML='<div class="card error"><h2>Lien de partage invalide</h2></div>';return}
  try{const r=await fetch('/api/shared-analysis?id='+encodeURIComponent(id));const d=await r.json();if(!r.ok)throw Error(d.error||'Analyse introuvable');render(d)}
  catch(e){document.querySelector('#app').innerHTML=`<div class="card error"><h2>Analyse indisponible</h2><p>${esc(e.message)}</p></div>`}
}
init();
</script>
</body></html>
