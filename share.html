<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Analyse partagée — ReVisite</title>
<style>
:root{--blue:#075cff;--ink:#14202b;--muted:#65717d;--bg:#f5f7fa;--line:#e1e7ed;--ok:#13795b;--okbg:#eaf7f2;--warn:#9a6500;--warnbg:#fff5df;--soft:#eef3ff}
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,system-ui,sans-serif;background:var(--bg);color:var(--ink)}.wrap{max-width:1080px;margin:auto;padding:0 22px}
nav{height:70px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center}.brand{font-size:25px;font-weight:950;letter-spacing:-1px;color:#111}.brand b{color:var(--blue)}.baseline{font-size:10px;color:var(--muted);margin-left:10px}
main{padding:28px 0}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;margin:12px 0}.hero{border-top:4px solid var(--blue)}.eyebrow{font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:1.1px;color:var(--blue)}h1,h2,h3{margin-top:0}h1{font-size:29px;margin:6px 0 8px}h2{font-size:18px;margin-bottom:12px}h3{font-size:13px;margin:14px 0 7px}.summary{line-height:1.55;color:#3d4c59;font-size:13px}.muted{color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.kpi{border:1px solid var(--line);border-radius:12px;padding:11px;background:#fbfcfd}.kpi span{display:block;font-size:9px;color:var(--muted);text-transform:uppercase;font-weight:800}.kpi b{display:block;margin-top:5px;font-size:16px}.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}.box{background:#f7f9fb;border-radius:12px;padding:13px}
.tag{display:inline-block;padding:6px 9px;border-radius:99px;background:var(--soft);color:#184baf;font-size:10px;font-weight:800}.scope{padding:11px 13px;border-radius:12px;background:#f7f9fb;border:1px solid var(--line);font-size:11px;line-height:1.45}.scope.warn{background:var(--warnbg);border-color:#efdaa7}
ul{padding-left:18px;margin:8px 0}li{margin:6px 0;line-height:1.45;font-size:12px}.source{font-size:10px;color:var(--muted);margin-top:2px}.empty{font-size:11px;color:var(--muted)}
.statusRow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.statusPill{padding:7px 9px;border-radius:99px;background:#f0f3f5;color:#51616d;font-size:10px;font-weight:800}.statusPill.ok{background:var(--okbg);color:var(--ok)}.statusPill.warn{background:var(--warnbg);color:var(--warn)}
.notice{padding:12px;border-radius:12px;background:var(--warnbg);color:#6f510f;font-size:11px;line-height:1.45}.error{text-align:center;padding:70px 20px}.footer{text-align:center;padding:24px;color:var(--muted);font-size:10px}
@media(max-width:760px){.grid,.cols{grid-template-columns:1fr 1fr}}@media(max-width:480px){.grid,.cols{grid-template-columns:1fr}}@media print{nav,.footer{display:none}body{background:#fff}.card{break-inside:avoid}}
</style>
</head>
<body>
<nav><div class="wrap" style="width:100%;display:flex;align-items:center"><div class="brand"><b>[re]</b>visite</div><div class="baseline">Au-delà de la visite.</div></div></nav>
<main><div class="wrap" id="app"><div class="card">Chargement de l’analyse…</div></div></main>
<div class="footer">ReVisite — Analyse documentaire et aide à la décision avant offre.</div>
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const arr=v=>Array.isArray(v)?v:[];
const txt=x=>typeof x==='string'?x:(x?.claim||x?.label||x?.title||x?.description||x?.detail||x?.issue||x?.work||'');
const money=v=>v==null||v===''?'N/C':new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR',maximumFractionDigits:0}).format(v);
const list=(v,n=8,empty='Aucun élément significatif identifié.')=>arr(v).slice(0,n).length?`<ul>${arr(v).slice(0,n).map(x=>`<li>${esc(txt(x))}${x?.source?`<div class="source">${esc(x.source)}${x.page?' · p. '+esc(x.page):''}</div>`:''}</li>`).join('')}</ul>`:`<span class="empty">${esc(empty)}</span>`;
const k=(l,v)=>`<div class="kpi"><span>${esc(l)}</span><b>${v}</b></div>`;
const score=v=>v===null||v===undefined||v===''||!Number.isFinite(Number(v))?null:Math.max(0,Math.min(100,Math.round(Number(v))));
const val=v=>v===null||v===undefined||v===''?'N/C':esc(v);
function render(d){
  const r=d.result||{},a=r.analysis||{},s=r.scores||{},meta=r.meta||{},p=a.property||{},m=a.market||{},c=a.copro_metrics||{},co=a.copro||{},w=a.works||{},bb=a.buyer_blocks||{},dw=bb.diagnostic_works||{},fc=bb.future_copro_costs||{},rb=bb.real_acquisition_budget||{},bc=bb.before_offer_checks||{},ex=a.executive_summary||{},n=a.negotiation||{},v=a.verdict||{},docs=a.documents||{};
  const withheld=Boolean(meta.score_withheld)||score(s.property)===null||score(s.copro)===null||score(s.market)===null;
  const overall=withheld?null:score(s.overall),documentation=score(s.documentation),confidence=score(s.confidence);
  const rejected=arr(docs.rejected),quality=arr(meta.document_quality);
  const partialCount=quality.filter(x=>x?.quality==='partial').length;
  const dvfUnavailable=meta.dvf_status&&meta.dvf_status!=='ok';
  document.title=(p.address?`${p.address} — `:'')+'Analyse ReVisite';
  const scopeClass=rejected.length||partialCount?'scope warn':'scope';
  const scopeText=rejected.length?`${rejected.length} document(s) exclus car non exploitables ; ils ne sont pas utilisés pour conclure.`:partialCount?`${partialCount} document(s) partiellement lisibles ; seules les informations effectivement extraites sont utilisées.`:'Les pièces exploitées sont indiquées dans le rapport.';
  document.querySelector('#app').innerHTML=`
    <div class="eyebrow">Analyse ReVisite partagée</div>
    <div class="card hero">
      <h1>${esc(v.label||ex.headline||'Synthèse du dossier')}</h1>
      <p class="summary">${esc(v.summary||ex.overview||'')}</p>
      <div class="${scopeClass}"><b>Périmètre documentaire</b><br>${esc(scopeText)} Une information absente n’est jamais assimilée à un défaut.</div>
      <div class="grid" style="margin-top:14px">
        ${k('Synthèse globale',overall===null?'N/C':overall+'/100')}
        ${k('Bien',score(s.property)===null?'N/C':score(s.property)+'/100')}
        ${k('Copropriété',score(s.copro)===null?'N/C':score(s.copro)+'/100')}
        ${k('Marché',score(s.market)===null?'N/C':score(s.market)+'/100')}
      </div>
      <div class="statusRow">
        ${documentation!==null?`<span class="statusPill">Couverture documentaire ${documentation}/100</span>`:''}
        ${confidence!==null?`<span class="statusPill">Fiabilité documentaire ${confidence}/100</span>`:''}
        ${dvfUnavailable?'<span class="statusPill warn">DVF+ officiel indisponible lors de l’analyse</span>':''}
        ${meta.degraded_mode?'<span class="statusPill warn">Rapport de secours</span>':'<span class="statusPill ok">Moteur complet</span>'}
      </div>
    </div>

    <div class="card"><h2>Le bien</h2>
      <div class="grid">
        ${k('Surface',p.surface_m2!=null?esc(p.surface_m2)+' m²':'N/C')}
        ${k('Pièces',val(p.rooms))}
        ${k('Étage',val(p.floor))}
        ${k('DPE',val(p.dpe))}
      </div>
      <div class="grid" style="margin-top:9px">
        ${k('Conso. énergie',p.energy_consumption_kwh_m2!=null?esc(p.energy_consumption_kwh_m2)+' kWh/m²/an':'N/C')}
        ${k('GES',p.ghg_kgco2_m2!=null?esc(p.ghg_kgco2_m2)+' kgCO₂/m²/an':'N/C')}
        ${k('Coût énergie bas',money(p.energy_cost_low))}
        ${k('Coût énergie haut',money(p.energy_cost_high))}
      </div>
      <p class="summary">${esc(p.property_analysis||'')}</p>
      <div class="cols"><div class="box"><h3>Éléments favorables documentés</h3>${list(ex.top_strengths||p.assets,3)}</div><div class="box"><h3>Points à clarifier</h3>${list(ex.top_risks||p.weaknesses,3,'Aucun point critique documenté.')}</div></div>
    </div>

    <div class="card"><h2>Prix & marché</h2>
      ${dvfUnavailable?'<div class="notice"><b>Source DVF+ officielle momentanément indisponible.</b> ReVisite n’affiche volontairement ni estimation, ni comparables, ni recommandation de prix tant que ces données ne peuvent pas être vérifiées.</div>':''}
      <div class="grid" style="margin-top:10px">
        ${k('Prix demandé',money(p.asking_price))}
        ${k('Valeur estimée',m.estimate_low!=null&&m.estimate_high!=null?money(m.estimate_low)+' – '+money(m.estimate_high):'N/C')}
        ${k('Offre indicative',m.offer_low!=null&&m.offer_high!=null?money(m.offer_low)+' – '+money(m.offer_high):'N/C')}
        ${k('Prix / m²',p.price_per_m2!=null?money(p.price_per_m2):'N/C')}
      </div>
      <p class="summary">${esc(m.analysis||m.positioning||'')}</p>
    </div>

    <div class="card"><h2>Copropriété & charges</h2>
      <div class="grid">
        ${k('Charges / an',money(c.lot_annual_charges))}
        ${k('Solde individuel',money(c.individual_balance))}
        ${k('Impayés collectifs',money(c.collective_arrears))}
        ${k('Fonds travaux',money(c.works_fund))}
      </div>
      <p class="summary">${esc(co.financial_analysis||'')}</p>
      <div class="cols">
        <div class="box"><h3>Travaux votés / à vérifier</h3>${list(w.voted,8,'Aucun travail voté exploitable identifié.')}</div>
        <div class="box"><h3>PPPT / travaux discutés</h3>${list([...arr(w.recommended_pppt),...arr(w.discussed)],8,'Aucun élément exploitable identifié.')}</div>
      </div>
      ${arr(w.recent_completed).length?`<h3>Historique de travaux réalisés</h3>${list(w.recent_completed,8)}`:''}
    </div>

    <div class="card"><h2>Diagnostics & exposition financière</h2>
      ${list(p.diagnostics,8,'Aucun diagnostic exploitable.') }
      <p class="summary">${esc(dw.summary||'')}</p>
      <div class="grid">
        ${k('Travaux privatifs bas',money(dw.total_budget_low))}
        ${k('Travaux privatifs haut',money(dw.total_budget_high))}
        ${k('Appel de fonds courant',money(c.current_call_amount))}
        ${k('Total à payer relevé',money(c.total_to_pay))}
      </div>
      <h3>Dépenses copropriété futures</h3><p class="summary">${esc(fc.summary||'')}</p>${list(fc.items,8,'Aucune dépense future chiffrable établie.')}
    </div>

    <div class="card"><h2>À vérifier avant l’offre</h2>
      <p class="summary">${esc(bc.summary||'')}</p>
      ${list(bc.checks?.length?bc.checks:a.questions_before_offer,8)}
      ${arr(bc.inconsistencies).length?`<h3>Incohérences à résoudre</h3>${list(bc.inconsistencies,6)}`:''}
    </div>

    <div class="card"><h2>Documents & traçabilité</h2>
      <div class="cols">
        <div class="box"><h3>Documents exploités</h3>${list(docs.received,30)}</div>
        <div class="box"><h3>Documents exclus / à obtenir</h3>${rejected.length?list(rejected,30):''}${list(docs.missing_or_to_obtain,10,'Aucun document complémentaire demandé.')}</div>
      </div>
      ${arr(a.evidence).length?`<h3>Faits sourcés</h3>${list(a.evidence.filter(x=>x?.status==='FACT'),20,'Aucun fait n’a pu être qualifié de FACT avec une source explicite.')}`:''}
    </div>

    <div class="card"><h2>Conclusion</h2>
      <p class="summary">${esc(v.why||v.summary||ex.overview||'')}</p>
      <p class="source">ReVisite distingue les faits documentés, les informations à confirmer et les données indisponibles. Un champ N/C signifie « non calculé », pas « mauvais ».</p>
    </div>
  `;
}
async function init(){
  const id=new URLSearchParams(location.search).get('id');
  if(!id){document.querySelector('#app').innerHTML='<div class="card error"><h2>Lien de partage invalide</h2></div>';return}
  try{const r=await fetch('/api/shared-analysis?id='+encodeURIComponent(id));const d=await r.json();if(!r.ok)throw Error(d.error||'Analyse introuvable');render(d)}
  catch(e){document.querySelector('#app').innerHTML=`<div class="card error"><h2>Analyse indisponible</h2><p>${esc(e.message)}</p></div>`}
}
init();
</script>
</body></html>
