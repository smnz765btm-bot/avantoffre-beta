name: ReVisite live DVF v3 check once

on:
  push:
    branches: [reliability-dpe-market-v3]
    paths:
      - '.github/workflows/revisite-live-dvf-v3-once.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate robust market reference on real Toulouse address
        shell: bash
        run: |
          set -euo pipefail
          cat > ./live-dvf-check.mjs <<'JS'
          import {parseStaticDvfCsv,applyOfficialMarketData} from './netlify/lib/reliability-core.mjs';
          const address='26 Chemin de Borderouge 31200 Toulouse';
          const gu=new URL('https://data.geopf.fr/geocodage/search/');
          gu.searchParams.set('q',address);gu.searchParams.set('limit','1');
          const g=await (await fetch(gu)).json(),f=g.features?.[0];
          if(!f)throw new Error('geocode failed');
          const [lon,lat]=f.geometry.coordinates,city=f.properties.citycode,dep=f.properties.depcode;
          let rows=[];
          for(const y of [2025,2024,2023]){
            const r=await fetch(`https://files.data.gouv.fr/geo-dvf/latest/csv/${y}/communes/${dep}/${city}.csv`,{redirect:'follow'});
            if(!r.ok)continue;
            rows.push(...parseStaticDvfCsv(await r.text(),{lat,lon,maxDistanceM:1200,source:'data.gouv.fr — DVF Etalab'}));
            if(rows.length>=100)break;
          }
          const a=applyOfficialMarketData({property:{title:'Appartement T4',surface_m2:83.44,rooms:4},market:{}},rows);
          const ref=a.market.dvf_reference||{};
          if(!(ref.sample_count>=12))throw new Error('sample too small '+ref.sample_count);
          if(!(a.market.estimate_low>=160000&&a.market.estimate_low<=210000))throw new Error('unexpected low '+a.market.estimate_low);
          if(!(a.market.estimate_high>=200000&&a.market.estimate_high<=250000))throw new Error('unexpected high '+a.market.estimate_high);
          if(!(a.market.estimate_high/a.market.estimate_low<1.4))throw new Error('range too wide');
          if(!a.market.comparables?.every(x=>String(x.source).includes('data.gouv.fr')))throw new Error('source mismatch');
          console.log(JSON.stringify({
            sample_count:ref.sample_count,radius_m:ref.radius_m,median_price_m2:ref.median_price_m2,
            q25_price_m2:ref.q25_price_m2,q75_price_m2:ref.q75_price_m2,
            estimate_low:a.market.estimate_low,estimate_high:a.market.estimate_high,
            confidence:a.market.confidence,dispersion_ratio:ref.dispersion_ratio,
            comparables:a.market.comparables.map(x=>({price:x.price,surface:x.surface,price_m2:x.price_m2,distance_m:x.distance_m}))
          },null,2));
          JS
          node ./live-dvf-check.mjs
