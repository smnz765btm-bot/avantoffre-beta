name: ReVisite cost optimization local check

on:
  push:
    branches: [cost-optimization-v1, upload-limit-fix-v1, reliability-market-v2]
    paths:
      - 'index.html'
      - 'ui-enhancements.js'
      - 'build-revisite.js'
      - 'netlify/**'
      - 'scripts/**'
      - 'package.json'
      - '.github/workflows/cost-optimization-local-check.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build and deterministic tests
        run: npm run build
      - name: Bundle-check Netlify functions locally
        run: |
          npx --yes esbuild netlify/functions/*.mts --bundle --platform=node --format=esm --packages=external --outdir=/tmp/revisite-functions
      - name: Install browser test
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium
          python3 -m pip install --quiet reportlab
      - name: Create local test documents
        run: |
          python3 - <<'PY'
          from reportlab.pdfgen import canvas
          from reportlab.lib.pagesizes import A4
          import os
          os.makedirs('/tmp/revisite-docs', exist_ok=True)
          for i in range(9):
              p=f'/tmp/revisite-docs/doc-{i+1}.pdf'
              c=canvas.Canvas(p,pagesize=A4)
              lines=[
                  f'Document test ReVisite {i+1}',
                  'Appartement T4 - surface Carrez 83,44 m2 - DPE C.',
                  'Charges annuelles du lot : 1976,66 euros.',
                  'Information documentaire de test fiable.'
              ]
              y=790
              for line in lines:
                  c.drawString(60,y,line); y-=24
              c.save()
          PY
      - name: Local browser E2E without Netlify
        run: |
          python3 -m http.server 4173 -d dist >/tmp/revisite-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          cat > ./cost-local-e2e.mjs <<'JS'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage();
          page.setDefaultTimeout(60000);
          page.on('console',m=>console.log('BROWSER_CONSOLE',m.type(),m.text()));
          page.on('pageerror',e=>console.log('BROWSER_PAGEERROR',e.message));
          page.on('requestfailed',r=>console.log('REQUEST_FAILED',r.url(),r.failure()?.errorText||''));

          let uploadCalls=0,statusCalls=0,legacyAddressCalls=0;
          const result={
            analysis:{
              property:{title:'T4 test',address:'26 chemin de Borderouge 31200 Toulouse',asking_price:null,surface_m2:83.44,price_per_m2:null,rooms:4,floor:'2e',dpe:'C',assets:['Surface documentée'],weaknesses:[],diagnostics:[],property_analysis:'Données de test.'},
              market:{estimate_low:null,estimate_high:null,offer_low:null,offer_high:null,confidence:'faible',positioning:'',comparables:[],analysis:'Marché non calculé.'},
              copro_metrics:{lot_annual_charges:1976.66,annual_budget:null,collective_arrears:null,works_fund:null,cash:null},
              copro:{financial_analysis:'Charges documentées.',strengths:[],weaknesses:[],litigation:[],recurring_topics:[]},
              works:{voted:[],discussed:[],rejected_or_postponed:[],recommended_pppt:[],recent_completed:[],analysis:''},
              buyer_blocks:{diagnostic_works:{summary:'',items:[],total_budget_low:null,total_budget_high:null},future_copro_costs:{summary:'',items:[]},real_acquisition_budget:{summary:'',purchase_price:null,acquisition_fees_estimate:null,private_works_low:null,private_works_high:null,known_total_low:null,known_total_high:null},before_offer_checks:{summary:'',checks:[],inconsistencies:[]}},
              documents:{received:Array.from({length:9},(_,i)=>'doc-'+(i+1)+'.pdf'),missing_or_to_obtain:[],quality_notes:[]},
              executive_summary:{headline:'Dossier lu',overview:'Analyse locale de validation.',top_strengths:['83,44 m²','DPE C'],top_risks:[],what_changes_the_decision:[]},
              negotiation:{recommended_strategy:'',arguments:[],conditions_before_offer:[]},
              evidence:[],questions_before_offer:[],
              verdict:{label:'Analyse terminée',summary:'Données de contrôle retrouvées.',vigilance:'modérée',why:'',go_if:[],stop_if:[]}
            },
            scores:{property:82,copro:null,market:null,documentation:65,confidence:61,overall:null},
            meta:{document_count:9,cache_hit:true}
          };

          await page.route('**/api/address-suggest**', async route=>{legacyAddressCalls++;await route.abort()});
          await page.route('https://data.geopf.fr/**', async route=>{
            await route.fulfill({status:200,contentType:'application/json',body:JSON.stringify({results:[{fulltext:'26 chemin de Borderouge 31200 Toulouse',city:'Toulouse',zipcode:'31200',x:1.45,y:43.62}]})});
          });
          await page.route('**/api/upload-document', async route=>{
            uploadCalls++;
            const body=JSON.parse(route.request().postData()||'{}');
            const docs=Array.isArray(body.documents)?body.documents:[];
            const rejectedIndex=6;
            const rows=docs.map(d=>d.index===rejectedIndex
              ? {index:d.index,name:d.name,chars:0,actualChars:0,quality:'failed',accepted:false,error:d.name+" n'est pas assez exploitable après OCR.",ocrPages:d.ocrPages||0,weakPages:d.weakPages||0,contentHash:null}
              : {index:d.index,name:d.name,chars:d.text.length,actualChars:d.text.length,quality:d.quality||'ok',accepted:true,error:null,ocrPages:d.ocrPages||0,weakPages:d.weakPages||0,contentHash:'local-'+d.index});
            await route.fulfill({status:200,contentType:'application/json',body:JSON.stringify({
              ref:'docbatch-local-'+body.batchIndex,
              count:rows.filter(x=>x.accepted).length,
              rejected:rows.filter(x=>!x.accepted).length,
              documents:rows
            })});
          });
          await page.route('**/api/analyze-background', async route=>{
            await route.fulfill({status:200,contentType:'application/json',body:JSON.stringify({jobId:'local',status:'done',cache_hit:true,result})});
          });
          await page.route('**/api/analyze-status**', async route=>{statusCalls++;await route.fulfill({status:500,contentType:'application/json',body:'{}'})});

          await page.goto('http://127.0.0.1:4173/',{waitUntil:'networkidle'});
          await page.locator('#address').fill('26 chemin de Borderouge');
          await page.waitForTimeout(650);
          await page.locator('#address').press('ArrowDown').catch(()=>{});
          await page.locator('#files').setInputFiles(Array.from({length:9},(_,i)=>'/tmp/revisite-docs/doc-'+(i+1)+'.pdf'));
          await page.locator('#analyze').click();
          for(let i=0;i<40;i++){
            if(await page.locator('#report').isVisible())break;
            await page.waitForTimeout(500);
          }
          if(!await page.locator('#report').isVisible()){
            console.log('DEBUG_STATUS',await page.locator('#status').innerText().catch(()=>'')); 
            console.log('DEBUG_LOADING',await page.locator('#loadingText').innerText().catch(()=>'')); 
            console.log('DEBUG_COUNTS',JSON.stringify({uploadCalls,statusCalls,legacyAddressCalls}));
            throw new Error('Report did not become visible');
          }
          const text=(await page.locator('#report').innerText()).toLowerCase();

          if(uploadCalls!==1) throw new Error('Expected 1 batched upload call, got '+uploadCalls);
          if(statusCalls!==0) throw new Error('Cached/immediate result must not poll status, got '+statusCalls);
          if(legacyAddressCalls!==0) throw new Error('Legacy Netlify address function was called '+legacyAddressCalls+' time(s)');
          if(await page.locator('script[src*="map-enhancements"]').count()) throw new Error('Broken legacy map enhancement script is still loaded');
          const badDocs=await page.locator('.ao-docstatus.bad').count();
          if(badDocs!==1) throw new Error('Exactly one rejected PDF should be flagged without blocking the report, got '+badDocs);
          if(!text.includes('83,44')&&!text.includes('83.44')) throw new Error('Surface control missing');
          if(!text.replace(/[^0-9]/g,'').includes('1977')&&!text.replace(/[^0-9]/g,'').includes('1976')) throw new Error('Charges control missing');

          console.log(JSON.stringify({uploadCalls,statusCalls,legacyAddressCalls,report:'ok'}));
          await browser.close();
          JS
          node ./cost-local-e2e.mjs
