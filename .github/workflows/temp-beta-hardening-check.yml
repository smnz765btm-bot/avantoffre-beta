name: Temporary beta hardening check

on:
  push:
    branches: [hardening-beta-reliability-20260921]
    paths:
      - '.github/workflows/temp-beta-hardening-check.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - name: Check generated report JS syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for name in ['index.html','share.html']:
              s=Path(name).read_text()
              if '<script type="module">' in s:
                  js=s.split('<script type="module">',1)[1].split('</script>',1)[0]
              else:
                  js=s.split('<script>',1)[1].split('</script>',1)[0]
              Path('/tmp/'+name+'.js').write_text(js)
          PY
          node --check /tmp/share.html.js
