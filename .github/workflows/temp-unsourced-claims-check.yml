name: Temporary unsourced claims check

on:
  push:
    branches: [guard-unsourced-property-claims]
    paths:
      - '.github/workflows/temp-unsourced-claims-check.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
