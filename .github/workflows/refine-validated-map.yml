name: Refine validated AvantOffre map

on:
  push:
    paths:
      - '.github/workflows/refine-validated-map.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch map UI
        run: echo '.. truncated ...' | base64 -d | python
      - name: Commit changes
        run: |
          git config user.name "AvantOffre Bot"
          git config user.email "actions@users.noreply.github.com"
          git add ui-enhancements.js index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Aligne la carte sur le rendu validé"
          git push
