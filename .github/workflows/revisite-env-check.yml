name: ReVisite credential format check

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/revisite-env-check.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Netlify deploy
        run: sleep 30
      - name: Check credential formats without exposing secrets
        run: curl -fsS https://revisite-demo.netlify.app/api/env-check
