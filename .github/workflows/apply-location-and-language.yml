name: Apply location and language refinements

on:
  push:
    paths:
      - '.github/workflows/apply-location-and-language.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python scripts/apply_location_patch.py
      - name: Commit changes
        run: |
          git config user.name "AvantOffre Bot"
          git config user.email "actions@users.noreply.github.com"
          git add ui-enhancements.js index.html netlify/functions/analyze-background.mts netlify/functions/analyze.mts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Ajoute localisation compacte et affine le ton du rapport"
          git push
