name: Probe official DVF static fallback once

on:
  push:
    branches: [reliability-report-v1]
    paths:
      - '.github/workflows/probe-dvf-static-once.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Probe Toulouse official static DVF files
        shell: bash
        run: |
          set -euo pipefail
          echo "GEOCODE SEARCH"
          curl -sS --max-time 15 'https://data.geopf.fr/geocodage/search/?q=26%20chemin%20de%20Borderouge%2031200%20Toulouse&limit=1' | jq '.features[0].properties'
          for Y in 2026 2025 2024 2023; do
            URL="https://files.data.gouv.fr/geo-dvf/latest/csv/$Y/communes/31/31555.csv"
            CODE=$(curl -L -sS --max-time 20 -o "/tmp/$Y.csv" -w '%{http_code}' "$URL")
            SIZE=$(wc -c < "/tmp/$Y.csv" || echo 0)
            echo "$Y HTTP=$CODE SIZE=$SIZE"
            if [ "$CODE" = "200" ]; then head -n 3 "/tmp/$Y.csv"; fi
          done
          python3 - <<'PY'
import csv, math
lat0,lon0=43.642529,1.456254
rows=[]
with open('/tmp/2025.csv',encoding='utf-8') as fh:
    for r in csv.DictReader(fh):
        if r.get('type_local')!='Appartement': continue
        try:
            lat=float(r['latitude']); lon=float(r['longitude']); surf=float(r['surface_reelle_bati']); price=float(r['valeur_fonciere'])
        except: continue
        dlat=math.radians(lat-lat0); dlon=math.radians(lon-lon0)
        a=math.sin(dlat/2)**2+math.cos(math.radians(lat0))*math.cos(math.radians(lat))*math.sin(dlon/2)**2
        dist=6371000*2*math.atan2(math.sqrt(a),math.sqrt(1-a))
        if dist<=1000 and 58<=surf<=109 and 500<price/surf<15000:
            rows.append((dist,r['date_mutation'],r['adresse_numero'],r['adresse_nom_voie'],surf,price,round(price/surf),r['id_mutation']))
print('FILTERED',len(rows))
for x in sorted(rows)[:20]: print(x)
PY
