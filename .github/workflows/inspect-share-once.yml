name: Inspect ReVisite share once

on:
  push:
    branches: [inspect-share-1f2e9fde]
    paths:
      - '.github/workflows/inspect-share-once.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Compare JS DVF parser with CSV structure
        shell: bash
        run: |
          set -euo pipefail
          curl -sS --max-time 25 'https://files.data.gouv.fr/geo-dvf/latest/csv/2025/communes/31/31555.csv' -o /tmp/dvf.csv
          cp /tmp/dvf.csv ./dvf.csv
          cat > ./inspect-dvf.mjs <<'JS'
          import fs from 'node:fs';
          import {parseStaticDvfCsv} from './netlify/lib/reliability-core.mjs';
          const csv=fs.readFileSync('./dvf.csv','utf8');
          const rows=parseStaticDvfCsv(csv,{lat:43.642529,lon:1.456254,maxDistanceM:1200,source:'data.gouv.fr — DVF Etalab'});
          console.log(JSON.stringify({
            total:rows.length,
            suspicious:rows.filter(r=>r.valeurfonc===299000 && r.sbati>=80 && r.sbati<=90).slice(0,10),
            nearest:rows.slice(0,10).map(r=>({price:r.valeurfonc,surface:r.sbati,date:r.datemut,distance_m:r.distance_m,address:r.address,id:r.id_mutation}))
          },null,2));
          JS
          node ./inspect-dvf.mjs
