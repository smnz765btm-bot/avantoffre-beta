name: Inspect ReVisite share once

on:
  push:
    branches: [inspect-share-1f2e9fde]
    paths:
      - '.github/workflows/inspect-share-once.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect suspicious DVF mutations only
        shell: bash
        run: |
          set -euo pipefail
          curl -sS --max-time 25 'https://files.data.gouv.fr/geo-dvf/latest/csv/2025/communes/31/31555.csv' -o /tmp/dvf.csv
          python3 - <<'PY'
          import csv, json, math
          lat0,lon0=43.642529,1.456254
          out=[]
          with open('/tmp/dvf.csv',encoding='utf-8') as fh:
              for r in csv.DictReader(fh):
                  if r.get('type_local')!='Appartement':
                      continue
                  try:
                      price=float(r['valeur_fonciere']); surf=float(r['surface_reelle_bati']); lat=float(r['latitude']); lon=float(r['longitude'])
                  except:
                      continue
                  dlat=math.radians(lat-lat0); dlon=math.radians(lon-lon0)
                  a=math.sin(dlat/2)**2+math.cos(math.radians(lat0))*math.cos(math.radians(lat))*math.sin(dlon/2)**2
                  dist=6371000*2*math.atan2(math.sqrt(a),math.sqrt(max(0,1-a)))
                  if dist<=150 and price>=280000 and 70<=surf<=100:
                      out.append({
                          'id_mutation':r.get('id_mutation'),
                          'date':r.get('date_mutation'),
                          'price':price,
                          'surface':surf,
                          'rooms':r.get('nombre_pieces_principales'),
                          'nombre_lots':r.get('nombre_lots'),
                          'lot1_numero':r.get('lot1_numero'),
                          'lot1_surface_carrez':r.get('lot1_surface_carrez'),
                          'lot2_numero':r.get('lot2_numero'),
                          'lot2_surface_carrez':r.get('lot2_surface_carrez'),
                          'surface_terrain':r.get('surface_terrain'),
                          'distance_m':round(dist)
                      })
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
