name: Inspect ReVisite share once

on:
  push:
    branches: [inspect-share-1f2e9fde]
    paths:
      - '.github/workflows/inspect-share-once.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect current DVF CSV schema
        shell: bash
        run: |
          set -euo pipefail
          curl -sS --max-time 25 'https://files.data.gouv.fr/geo-dvf/latest/csv/2025/communes/31/31555.csv' -o /tmp/dvf.csv
          python3 - <<'PY'
          import csv, json
          raw=open('/tmp/dvf.csv','r',encoding='utf-8-sig').read(4096)
          print('PREFIX',repr(raw[:240]))
          try:
              d=csv.Sniffer().sniff(raw,delimiters=',;\t|')
              print('DELIMITER',repr(d.delimiter))
          except Exception as e:
              print('DELIMITER_ERR',str(e))
          first=raw.splitlines()[0]
          print('HEADER_COUNT_COMMA',len(first.split(',')))
          print('HEADER_COUNT_SEMI',len(first.split(';')))
          print('HEADER',first[:1500])
          PY
