name: Harden AvantOffre PDF reading
on:
  push:
    paths:
      - '.github/workflows/raise-upload-limit.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply PDF reliability upgrade
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          # 1) Upgrade browser-side PDF extraction with per-page OCR fallback.
          p=Path('index.html')
          s=p.read_text()
          pattern=re.compile(r"async function extractFile\(f\)\{.*?\}async function uploadDocs\(jobId\)\{",re.S)
          replacement=r'''const AO_MIN_NATIVE_PAGE_CHARS=90,AO_MIN_USABLE_PAGE_CHARS=35;let aoTesseractPromise=null;
          const aoCleanLen=t=>String(t||'').replace(/\s+/g,' ').trim().length;
          async function aoLoadTesseract(){if(window.Tesseract)return window.Tesseract;if(aoTesseractPromise)return aoTesseractPromise;aoTesseractPromise=new Promise((resolve,reject)=>{const existing=document.querySelector('script[data-ao-ocr]');if(existing){existing.addEventListener('load',()=>resolve(window.Tesseract),{once:true});existing.addEventListener('error',()=>reject(new Error('Moteur OCR indisponible')),{once:true});return}const sc=document.createElement('script');sc.src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';sc.dataset.aoOcr='1';sc.onload=()=>window.Tesseract?resolve(window.Tesseract):reject(new Error('Moteur OCR indisponible'));sc.onerror=()=>reject(new Error('Moteur OCR indisponible'));document.head.appendChild(sc)});return aoTesseractPromise}
          async function aoOcrPage(page,fileName,pageNo,totalPages){status(`Seconde lecture OCR ${pageNo}/${totalPages} : ${fileName}`);const T=await aoLoadTesseract();const base=page.getViewport({scale:1});const maxPixels=3200000;let scale=2;const projected=base.width*base.height*scale*scale;if(projected>maxPixels)scale=Math.max(1.15,Math.sqrt(maxPixels/(base.width*base.height)));const viewport=page.getViewport({scale});const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.floor(viewport.width));canvas.height=Math.max(1,Math.floor(viewport.height));const ctx=canvas.getContext('2d',{alpha:false,willReadFrequently:true});await page.render({canvasContext:ctx,viewport}).promise;const result=await T.recognize(canvas,'fra');canvas.width=1;canvas.height=1;return String(result?.data?.text||'').trim()}
          async function extractFile(f){
            if(f.type==='text/plain'){const text=(await f.text()).slice(0,480000);return{name:f.name,text,pages:1,quality:aoCleanLen(text)>=35?'ok':'failed',ocrPages:0,weakPages:aoCleanLen(text)>=35?0:1,pageStats:[{page:1,method:'text',chars:aoCleanLen(text)}]}}
            const pdf=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise;let parts=[],ocrPages=0,weakPages=0,pageStats=[];
            for(let p=1;p<=pdf.numPages;p++){
              const page=await pdf.getPage(p);let native='';try{const c=await page.getTextContent();native=c.items.map(x=>x.str).join(' ').trim()}catch{}
              let finalText=native,method='native';
              if(aoCleanLen(native)<AO_MIN_NATIVE_PAGE_CHARS){try{const ocr=await aoOcrPage(page,f.name,p,pdf.numPages);ocrPages++;if(aoCleanLen(ocr)>aoCleanLen(native)){finalText=ocr;method='ocr'}}catch(err){method='ocr-failed'}}
              const chars=aoCleanLen(finalText);if(chars<AO_MIN_USABLE_PAGE_CHARS)weakPages++;
              pageStats.push({page:p,method,chars});parts.push(`\n[PAGE ${p} | ${method.toUpperCase()}]\n${finalText}`)
            }
            let text=parts.join('\n');const totalChars=aoCleanLen(text);const allowedWeak=Math.max(1,Math.floor(pdf.numPages*.12));let quality=totalChars<80?'failed':weakPages>allowedWeak?'partial':'ok';
            if(text.length>480000)text=text.slice(0,480000)+'\n[CONTENU TRONQUÉ À 480000 CARACTÈRES — document très long]';
            return{name:f.name,text,pages:pdf.numPages,quality,ocrPages,weakPages,pageStats}
          }
          async function uploadDocs(jobId){'''
          ns,n=pattern.subn(replacement,s,1)
          if n!=1:
              raise SystemExit(f'extractFile pattern not found exactly once: {n}')
          p.write_text(ns)

          # 2) Make client feedback distinguish partial/failed OCR instead of generic scan error.
          p=Path('ui-enhancements.js');u=p.read_text()
          old="if(Number(chars)<80)return{reason:'Non lisible',solution:'PDF probablement scanné : utilisez l’original ou appliquez un OCR.',kind:'bad'};"
          new="if(Number(chars)<80)return{reason:e.includes('partielle')?'Lecture partielle après seconde lecture':'Lecture insuffisante après seconde lecture',solution:e.includes('partielle')?'Certaines pages restent difficiles à exploiter. Fournissez si possible le PDF natif ou une version plus nette.':'AvantOffre a tenté une seconde lecture OCR sans obtenir assez de contenu fiable. Fournissez une version non protégée ou plus nette.',kind:e.includes('partielle')?'warn':'bad'};"
          if old not in u:
              raise SystemExit('reasonFor pattern not found')
          p.write_text(u.replace(old,new,1))

          # 3) Persist extraction quality metadata server-side and block documents that remain unreadable.
          p=Path('netlify/functions/upload-document.mts')
          p.write_text('''import type { Context, Config } from "@netlify/functions";\nimport { getStore } from "@netlify/blobs";\n\nfunction jobStore(){return getStore("avantoffre-jobs",{consistency:"strong"})}\nconst json=(body:any,status=200)=>new Response(JSON.stringify(body),{status,headers:{"Content-Type":"application/json; charset=utf-8","Cache-Control":"no-store"}});\n\nexport default async(req:Request,_context:Context)=>{\n  if(req.method!=="POST")return json({error:"Méthode non autorisée."},405);\n  try{\n    const body:any=await req.json();\n    const jobId=String(body?.jobId||"").replace(/[^a-zA-Z0-9_-]/g,"").slice(0,80);\n    const index=Number(body?.index);\n    const name=String(body?.name||"document").slice(0,240);\n    const text=String(body?.text||"");\n    const pages=Number.isFinite(Number(body?.pages))?Number(body.pages):null;\n    const quality=["ok","partial","failed"].includes(String(body?.quality))?String(body.quality):text.trim().length>=80?"ok":"failed";\n    const ocrPages=Math.max(0,Number(body?.ocrPages)||0);\n    const weakPages=Math.max(0,Number(body?.weakPages)||0);\n    const pageStats=Array.isArray(body?.pageStats)?body.pageStats.slice(0,250):[];\n    if(!jobId||!Number.isInteger(index)||index<0||index>29)return json({error:"Référence de document invalide."},400);\n    if(text.length>500000)return json({error:"Document trop volumineux après extraction."},413);\n    if(quality==="failed"||text.trim().length<80)return json({error:"Lecture insuffisante après seconde lecture OCR. Le document n'est pas assez exploitable pour une analyse fiable.",quality,ocrPages,weakPages,chars:text.length},422);\n    const key=`doc-${jobId}-${index}`;\n    await jobStore().setJSON(key,{name,text,pages,chars:text.length,quality,ocrPages,weakPages,pageStats});\n    if(quality==="partial")return json({ref:key,index,name,chars:79,actualChars:text.length,quality,ocrPages,weakPages,error:`Lecture partielle après OCR : ${weakPages} page(s) restent difficiles à exploiter.`});\n    return json({ref:key,index,name,chars:text.length,actualChars:text.length,quality,ocrPages,weakPages});\n  }catch(err:any){\n    console.error("AvantOffre upload document error",err);\n    return json({error:err?.message||"Impossible d'envoyer le document."},500);\n  }\n};\n\nexport const config:Config={path:"/api/upload-document"};\n''')

          # 4) Feed extraction quality explicitly to the analysis worker.
          p=Path('netlify/functions/analyze-ref-background.mts');a=p.read_text()
          old="const weak=/EXTRACTION TEXTE FAIBLE|EXTRACTION IMPOSSIBLE/i.test(text);\n      return `${String(d?.name||\"document\")}: ${weak?\"extraction faible à confirmer\":text.length>=500?\"contenu texte exploitable\":\"contenu court mais exploitable si les informations sont présentes\"} (${text.length} caractères extraits${d?.pages?`, ${d.pages} pages`:\"\"})`;"
          new="const weak=/EXTRACTION TEXTE FAIBLE|EXTRACTION IMPOSSIBLE/i.test(text);\n      const q=String(d?.quality||\"\");const qLabel=q===\"partial\"?`lecture partielle après OCR (${Number(d?.weakPages)||0} page(s) faibles)`:q===\"ok\"?`lecture contrôlée${Number(d?.ocrPages)?` avec OCR sur ${Number(d.ocrPages)} page(s)`:\"\"}`:weak?\"extraction faible à confirmer\":text.length>=500?\"contenu texte exploitable\":\"contenu court mais exploitable si les informations sont présentes\";\n      return `${String(d?.name||\"document\")}: ${qLabel} (${text.length} caractères extraits${d?.pages?`, ${d.pages} pages`:\"\"})`;"
          if old not in a:
              raise SystemExit('quality worker pattern not found')
          p.write_text(a.replace(old,new,1))
          PY
      - name: Static reliability tests
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          index=Path('index.html').read_text()
          ui=Path('ui-enhancements.js').read_text()
          upload=Path('netlify/functions/upload-document.mts').read_text()
          worker=Path('netlify/functions/analyze-ref-background.mts').read_text()
          checks={
            'OCR engine loader':'tesseract.js@5' in index,
            'per-page OCR fallback':'aoOcrPage' in index and 'AO_MIN_NATIVE_PAGE_CHARS' in index,
            'quality status':'quality=totalChars<80' in index,
            'server blocks unreadable':'status,422' in upload and 'quality==="failed"' in upload,
            'partial read surfaced':'Lecture partielle après OCR' in upload and 'Lecture partielle après seconde lecture' in ui,
            'worker receives quality':'lecture contrôlée' in worker and 'weakPages' in worker,
          }
          failed=[k for k,v in checks.items() if not v]
          print('\n'.join(f"{'PASS' if v else 'FAIL'} - {k}" for k,v in checks.items()))
          if failed: raise SystemExit('Failed checks: '+', '.join(failed))
          m=re.search(r'<script type="module">(.*?)</script>',index,re.S)
          if not m: raise SystemExit('inline module not found')
          Path('/tmp/avantoffre-inline.mjs').write_text(m.group(1))
          PY
          node --check /tmp/avantoffre-inline.mjs
          node --check ui-enhancements.js
      - name: Commit reliability upgrade
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html ui-enhancements.js netlify/functions/upload-document.mts netlify/functions/analyze-ref-background.mts
          git commit -m "Add OCR fallback and PDF reliability checks" || exit 0
          git push
