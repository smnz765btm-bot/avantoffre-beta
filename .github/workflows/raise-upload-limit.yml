name: Raise AvantOffre upload limit
on:
  push:
    paths:
      - '.github/workflows/raise-upload-limit.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Raise limit and add explicit upload feedback
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('Maximum : 30 fichiers · 50 Mo au total.','Maximum : 30 fichiers · 100 Mo au total. <span id="uploadUsage"></span>')
          s=s.replace('const MAX_FILES=30,MAX_BYTES=50*1024*1024;', 'const MAX_FILES=30,MAX_BYTES=100*1024*1024;')
          old="function add(fs){for(const f of fs){if(selected.length>=MAX_FILES)break;if(!selected.some(x=>x.name===f.name&&x.size===f.size))selected.push(f)}let total=selected.reduce((s,f)=>s+f.size,0);while(total>MAX_BYTES&&selected.length){selected.pop();total=selected.reduce((s,f)=>s+f.size,0)}$('#filesList').innerHTML="
          new="function add(fs){let rejected=[];for(const f of fs){if(selected.length>=MAX_FILES){rejected.push(f.name+' : maximum de 30 fichiers atteint');continue}if(selected.some(x=>x.name===f.name&&x.size===f.size))continue;const nextTotal=selected.reduce((s,x)=>s+x.size,0)+f.size;if(nextTotal>MAX_BYTES){rejected.push(f.name+' : le dossier dépasserait 100 Mo');continue}selected.push(f)}let total=selected.reduce((s,f)=>s+f.size,0);const usage=$('#uploadUsage');if(usage)usage.textContent=' · '+(total/1048576).toFixed(1)+' / 100 Mo utilisés';if(rejected.length){$('#status').classList.remove('hidden');$('#status').textContent='Fichier non ajouté — '+rejected.join(' · ')}$('#filesList').innerHTML="
          if old not in s:
              raise SystemExit('Expected add() pattern not found; refusing unsafe edit')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Raise document upload limit to 100 MB with feedback" || exit 0
          git push
