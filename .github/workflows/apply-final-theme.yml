name: Apply final AvantOffre theme
on:
  push:
    paths:
      - 'global-theme.css'
      - '.github/workflows/apply-final-theme.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add global theme stylesheet
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          tag='<link rel="stylesheet" href="/global-theme.css?v=final-1">'
          if tag not in s:
              s=s.replace('</head>',tag+'</head>',1)
          p.write_text(s)
          PY
      - name: Commit changes
        run: |
          git config user.name 'AvantOffre Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Uniformise le rendu final sur toute l app'
          git push
