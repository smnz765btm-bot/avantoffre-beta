name: ReVisite browser one-shot E2E
# production verification after stability hardening
# document-confidence UI verification

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/revisite-ui-e2e-once.yml'

permissions:
  contents: read

jobs:
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install browser test dependencies
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
          python3 -m pip install reportlab
      - name: Create synthetic dossier
        run: |
          python3 - <<'PY'
          from reportlab.pdfgen import canvas
          from reportlab.lib.pagesizes import A4
          docs=[
            ("diagnostics.pdf",[
              "Diagnostic de performance energetique DPE C.",
              "Surface Carrez : 83,44 m2.",
              "Appartement T4.",
              "Installation electrique : aucune anomalie majeure relevee."
            ]),
            ("charges.pdf",[
              "Decompte de charges du lot.",
              "Total annuel : 1976,66 euros.",
              "Charges courantes de copropriete."
            ]),
            ("PLAN_APT_B12.pdf",[
              "Plan appartement T3 surface 62,3 m2.",
              "Sejour cuisine chambre chambre."
            ])
          ]
          for name,lines in docs:
              c=canvas.Canvas("/tmp/"+name,pagesize=A4)
              y=800
              for line in lines:
                  c.drawString(60,y,line); y-=24
              c.save()
          PY
      - name: Run production browser flow
        run: |
          cat > ./e2e.mjs <<'JS'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage();
          page.setDefaultTimeout(180000);
          page.on('response', async res => {
            if(res.url().includes('/api/analyze-status')){
              try{console.log('STATUS_RESPONSE', await res.text())}catch{}
            }
          });
          await page.goto('https://revisite-demo.netlify.app/?e2e=1',{waitUntil:'networkidle'});
          await page.locator('#address').fill('26 chemin de Borderouge 31200 Toulouse');
          await page.locator('#files').setInputFiles(['/tmp/diagnostics.pdf','/tmp/charges.pdf','/tmp/PLAN_APT_B12.pdf']);
          await page.waitForFunction(() => document.querySelectorAll('#filesList .file').length >= 3);
          await page.locator('#analyze').click();
          const report=page.locator('#report');
          await report.waitFor({state:'visible',timeout:240000});
          const text=(await report.innerText()).toLowerCase();
          console.log('REPORT_TEXT_START');
          console.log(text.slice(0,12000));
          console.log('REPORT_TEXT_END');
          if(!text.trim()) throw new Error('Rapport visible mais vide');
          const graphicalCount=await page.locator('#filesList .ao-docstatus.graphical').count();
          if(graphicalCount<1) throw new Error('Plan graphique non reconnu dans l interface');
          const readSummary=((await page.locator('#aoReadWarning').count())?await page.locator('#aoReadWarning').innerText():'').toLowerCase();
          console.log('READ_SUMMARY',readSummary);
          if(!readSummary.includes('3 documents exploitables sur 3')) throw new Error('Résumé documentaire attendu absent');
          if(!readSummary.includes('document graphique détecté')) throw new Error('Mention graphique attendue absente');
          console.log('FIRST ANALYSIS RENDERED');
          await page.locator('#analyze').click();
          await report.waitFor({state:'visible',timeout:120000});
          console.log('CACHE/RETRY FLOW OK');
          await browser.close();
          JS
          node ./e2e.mjs
